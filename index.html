<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kirbybonk v2.2 點擊修復版</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background-color: #0b0818; font-family: sans-serif;
            touch-action: manipulation;
        }
        #gameCanvas { display: block; width: 100vw; height: 100vh; background: #18122B; }
        
        .screen {
            position: absolute; inset: 0; background: rgba(11, 8, 24, 0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; z-index: 50; padding: 20px; text-align: center;
        }
        .hidden { display: none !important; }
        
        h1 { font-size: 2.5rem; color: #ff76a3; margin-bottom: 10px; text-shadow: 0 0 10px #ff5288; }
        p { font-size: 1rem; color: #cbd5e1; margin-bottom: 20px; }
        
        input {
            background: #0f172a; border: 3px solid #a855f7; color: #fef08a;
            padding: 12px; font-size: 1.1rem; text-align: center; border-radius: 8px;
            width: 100%; max-width: 280px; margin-bottom: 20px; outline: none;
        }
        
        .btn {
            background: #ff5288; border: 3px solid #ffffff; color: white;
            padding: 14px 28px; font-size: 1.2rem; font-weight: bold; border-radius: 12px;
            cursor: pointer; box-shadow: 0 5px 0 #b32050; margin: 8px 0; width: 100%; max-width: 280px;
            transition: transform 0.1s;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #b32050; }
        .btn-secondary { background: #4c1d95; border-color: #a855f7; box-shadow: 0 5px 0 #2e1065; }
        
        #hud {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; align-items: center;
            color: white; pointer-events: none; z-index: 20; font-weight: bold; font-size: 14px;
        }
        .hud-box { background: rgba(15, 23, 42, 0.85); border: 2px solid #ff76a3; padding: 8px 12px; border-radius: 8px; pointer-events: auto; }

        #joystick {
            position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px;
            border-radius: 50%; background: rgba(255,255,255,0.1); border: 3px solid rgba(255,255,255,0.3);
            z-index: 30; touch-action: none; display: none;
        }
        #joystick-knob {
            position: absolute; top: 35px; left: 35px; width: 50px; height: 50px;
            border-radius: 50%; background: #ff5288; border: 2px solid white;
        }
        #ult-btn {
            position: absolute; bottom: 30px; right: 30px; width: 80px; height: 80px;
            border-radius: 50%; background: #facc15; border: 4px solid white; color: #713f12;
            font-weight: 900; font-size: 14px; display: none; align-items: center; justify-content: center;
            z-index: 30; box-shadow: 0 6px 0 #ca8a04; cursor: pointer;
        }
        #ult-btn:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <div id="hud" class="hidden">
        <div class="hud-box">等級: <span id="ui-level">1</span> | <span id="ui-class">一般卡比</span></div>
        <div class="hud-box">時間: <span id="ui-time">00:00</span> | 擊退: <span id="ui-kills">0</span></div>
        <div class="hud-box">HP: <span id="ui-hp">100/100</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="joystick"><div id="joystick-knob"></div></div>
    <div id="ult-btn">BONK!</div>

    <!-- 主選單 -->
    <div id="start-screen" class="screen">
        <div style="font-size: 3rem; margin-bottom: 5px;">⭐</div>
        <h1>Kirbybonk</h1>
        <p>能力變身倖存者 v2.2</p>
        <input type="text" id="nickname-input" placeholder="輸入玩家暱稱..." maxlength="12" value="英雄卡比">
        <button class="btn" id="start-btn">開始冒險！</button>
    </div>

    <!-- 升級選單 -->
    <div id="upgrade-screen" class="screen hidden">
        <h2 style="color: #facc15; font-size: 1.8rem; margin-bottom: 15px;">等級提升！</h2>
        <p>選擇一項能力強化：</p>
        <button class="btn" id="up-dmg">🔥 攻擊傷害提升 (+30%)</button>
        <button class="btn btn-secondary" id="up-spd">⚡ 移動速度加快 (+15%)</button>
        <button class="btn" id="up-hp">💚 回復全部血量並加上限</button>
    </div>

    <!-- 遊戲結束選單 -->
    <div id="gameover-screen" class="screen hidden">
        <h1 style="color: #ef4444;">遊戲結束</h1>
        <p id="gameover-stats" style="margin-bottom: 20px; line-height: 1.6;"></p>
        <button class="btn" id="restart-btn">重新挑戰</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let gameState = 'START'; 
        let gameTime = 0, killCount = 0, frameCount = 0;
        let player = {
            x: 0, y: 0, vx: 0, vy: 0, speed: 3.5, 
            hp: 100, maxHp: 100, level: 1, exp: 0, nextExp: 10,
            cls: 'NORMAL', dmgMultiplier: 1.0
        };
        let enemies = [], projectiles = [], gems = [];
        let keys = {};

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        const joystick = document.getElementById('joystick');
        const knob = document.getElementById('joystick-knob');
        let joyActive = false, joyDir = { x: 0, y: 0 };

        joystick.addEventListener('touchstart', e => { joyActive = true; handleJoy(e); });
        window.addEventListener('touchmove', e => { if(joyActive) handleJoy(e); });
        window.addEventListener('touchend', () => { joyActive = false; joyDir = {x:0, y:0}; knob.style.transform = `translate(0px, 0px)`; });

        function handleJoy(e) {
            const touch = e.touches[0];
            const rect = joystick.getBoundingClientRect();
            let dx = touch.clientX - (rect.left + rect.width / 2);
            let dy = touch.clientY - (rect.top + rect.height / 2);
            const dist = Math.hypot(dx, dy);
            const maxR = 35;
            if (dist > maxR) { dx = (dx/dist)*maxR; dy = (dy/dist)*maxR; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            joyDir = { x: dx/maxR, y: dy/maxR };
        }

        // 確保按鈕點擊能 100% 觸發
        document.getElementById('start-btn').onclick = function() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            if('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                joystick.style.display = 'block';
                document.getElementById('ult-btn').style.display = 'flex';
            }
            initGame();
            gameState = 'PLAYING';
        };

        document.getElementById('ult-btn').onclick = function() {
            if(gameState !== 'PLAYING') return;
            enemies.forEach(e => { e.hp -= 100; });
            createBurst(player.x, player.y, '#facc15', 30);
        };

        document.getElementById('up-dmg').onclick = () => { player.dmgMultiplier += 0.3; resumeGame(); };
        document.getElementById('up-spd').onclick = () => { player.speed += 0.8; resumeGame(); };
        document.getElementById('up-hp').onclick = () => { player.maxHp += 30; player.hp = player.maxHp; resumeGame(); };
        document.getElementById('restart-btn').onclick = () => {
            document.getElementById('gameover-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            initGame();
            gameState = 'PLAYING';
        };

        function resumeGame() {
            document.getElementById('upgrade-screen').classList.add('hidden');
            gameState = 'PLAYING';
        }

        function initGame() {
            player.x = 0; player.y = 0; player.hp = 100; player.maxHp = 100;
            player.level = 1; player.exp = 0; player.nextExp = 10;
            player.cls = 'NORMAL'; player.dmgMultiplier = 1.0; player.speed = 3.5;
            gameTime = 0; killCount = 0; frameCount = 0;
            enemies = []; projectiles = []; gems = [];
        }

        function createBurst(x, y, color, count=10) {
            for(let i=0; i<count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const spd = 2 + Math.random() * 3;
                projectiles.push({
                    type: 'particle', x, y, vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd,
                    color, life: 20, maxLife: 20
                });
            }
        }

        function update() {
            if (gameState !== 'PLAYING') return;
            frameCount++;
            gameTime += 1/60;

            let mx = 0, my = 0;
            if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
            if (keys['KeyW'] || keys['ArrowUp']) my -= 1;
            if (keys['KeyS'] || keys['ArrowDown']) my += 1;
            if (joyActive) { mx = joyDir.x; my = joyDir.y; }

            const len = Math.hypot(mx, my);
            if (len > 0) {
                player.x += (mx / (len > 1 ? len : 1)) * player.speed;
                player.y += (my / (len > 1 ? len : 1)) * player.speed;
            }

            if (frameCount % 40 === 0) {
                let target = null, minDist = 600;
                enemies.forEach(e => {
                    const d = Math.hypot(e.x - player.x, e.y - player.y);
                    if (d < minDist) { minDist = d; target = e; }
                });
                const angle = target ? Math.atan2(target.y - player.y, target.x - player.x) : Math.random()*Math.PI*2;
                projectiles.push({
                    type: 'star', x: player.x, y: player.y,
                    vx: Math.cos(angle)*7, vy: Math.sin(angle)*7,
                    damage: 15 * player.dmgMultiplier, life: 60
                });
            }

            let spawnInterval = Math.max(15, 45 - Math.floor(gameTime/3));
            if (frameCount % spawnInterval === 0 && enemies.length < 150) {
                const angle = Math.random() * Math.PI * 2;
                const dist = 450 + Math.random()*100;
                enemies.push({
                    x: player.x + Math.cos(angle)*dist,
                    y: player.y + Math.sin(angle)*dist,
                    hp: 15 + gameTime * 0.5, maxHp: 15 + gameTime * 0.5,
                    speed: 1.4 + Math.random()*0.5, size: 16
                });
            }

            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                p.x += p.vx; p.y += p.vy;
                p.life--;
                if(p.type === 'particle' && p.life <= 0) projectiles.splice(i, 1);
                if(p.type === 'star') {
                    enemies.forEach((e, ei) => {
                        if (Math.hypot(e.x - p.x, e.y - p.y) < e.size + 8) {
                            e.hp -= p.damage;
                            p.life = 0;
                            createHitSpark(e.x, e.y);
                            if (e.hp <= 0) {
                                killCount++;
                                gems.push({ x: e.x, y: e.y, value: 5 });
                                enemies.splice(ei, 1);
                            }
                        }
                    });
                    if (p.life <= 0) projectiles.splice(i, 1);
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                const angle = Math.atan2(player.y - e.y, player.x - e.x);
                e.x += Math.cos(angle) * e.speed;
                e.y += Math.sin(angle) * e.speed;

                if (Math.hypot(player.x - e.x, player.y - e.y) < e.size + 10) {
                    player.hp -= 0.6;
                    if (player.hp <= 0) triggerGameOver();
                }
            }

            for (let i = gems.length - 1; i >= 0; i--) {
                let g = gems[i];
                const d = Math.hypot(player.x - g.x, player.y - g.y);
                if (d < 120) {
                    g.x += (player.x - g.x) * 0.2;
                    g.y += (player.y - g.y) * 0.2;
                }
                if (d < 15) {
                    player.exp += g.value;
                    gems.splice(i, 1);
                    if (player.exp >= player.nextExp) {
                        player.level++;
                        player.exp = 0;
                        player.nextExp = Math.floor(player.nextExp * 1.4);
                        gameState = 'UPGRADE';
                        document.getElementById('upgrade-screen').classList.remove('hidden');
                    }
                }
            }

            updateHUD();
        }

        function createHitSpark(x, y) {
            for(let i=0; i<3; i++) {
                projectiles.push({ type: 'particle', x, y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4, color: '#fef08a', life: 10, maxLife: 10 });
            }
        }

        function updateHUD() {
            document.getElementById('ui-level').innerText = player.level;
            const m = Math.floor(gameTime/60).toString().padStart(2,'0');
            const s = Math.floor(gameTime%60).toString().padStart(2,'0');
            document.getElementById('ui-time').innerText = `${m}:${s}`;
            document.getElementById('ui-kills').innerText = killCount;
            document.getElementById('ui-hp').innerText = `${Math.max(0, Math.ceil(player.hp))}/${player.maxHp}`;
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            document.getElementById('hud').classList.add('hidden');
            joystick.style.display = 'none';
            document.getElementById('ult-btn').style.display = 'none';
            
            const m = Math.floor(gameTime/60).toString().padStart(2,'0');
            const s = Math.floor(gameTime%60).toString().padStart(2,'0');
            document.getElementById('gameover-stats').innerHTML = `
                生存時間: <b>${m}:${s}</b><br>
                擊退敵數: <b>${killCount}</b> 隻<br>
                最終等級: <b>Lv.${player.level}</b>
            `;
            document.getElementById('gameover-screen').classList.remove('hidden');
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(canvas.width / 2 - player.x, canvas.height / 2 - player.y);

            ctx.fillStyle = '#231942';
            const startX = Math.floor((player.x - canvas.width)/64)*64;
            const endX = startX + canvas.width * 2;
            const startY = Math.floor((player.y - canvas.height)/64)*64;
            const endY = startY + canvas.height * 2;
            for(let x=startX; x<endX; x+=64) {
                for(let y=startY; y<endY; y+=64) {
                    if((x/64 + y/64)%2 === 0) ctx.fillRect(x, y, 64, 64);
                }
            }

            gems.forEach(g => {
                ctx.fillStyle = '#facc15';
                ctx.beginPath(); ctx.arc(g.x, g.y, 4, 0, Math.PI*2); ctx.fill();
            });

            projectiles.forEach(p => {
                if(p.type === 'star') {
                    ctx.fillStyle = '#facc15';
                    ctx.fillRect(p.x-5, p.y-5, 10, 10);
                } else if(p.type === 'particle') {
                    ctx.fillStyle = p.color || '#fff';
                    ctx.globalAlpha = p.life / p.maxLife;
                    ctx.fillRect(p.x-2, p.y-2, 4, 4);
                    ctx.globalAlpha = 1.0;
                }
            });

            enemies.forEach(e => {
                ctx.fillStyle = '#f97316';
                ctx.beginPath(); ctx.arc(e.x, e.y, e.size, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(e.x - 4, e.y - 4, 3, 5);
                ctx.fillRect(e.x + 2, e.y - 4, 3, 5);
            });

            ctx.fillStyle = '#ff8cb3';
            ctx.beginPath(); ctx.arc(player.x, player.y, 14, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(player.x - 4, player.y - 4, 3, 6);
            ctx.fillRect(player.x + 2, player.y - 4, 3, 6);

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
