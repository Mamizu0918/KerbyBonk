<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kirby Bonk! - 星之卡比大亂鬥原型</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1024px;
            max-height: 768px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background-color: #70c5ce;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* 手機 UI 按鈕層 (預設隱藏，僅在觸控裝置顯示) */
        .mobile-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none; 
        }
        .touch-btn {
            position: absolute;
            pointer-events: auto;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            border: 3px solid rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #333;
            font-size: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .touch-btn:active {
            background: rgba(255, 255, 255, 0.8);
            transform: scale(0.92);
        }
        #joystick-base {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.6);
            pointer-events: auto;
        }
        #joystick-stick {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 105, 180, 0.85);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        #btn-inhale {
            bottom: 40px;
            right: 40px;
            width: 75px;
            height: 75px;
            background: rgba(255, 182, 193, 0.85);
        }
        #btn-ability {
            bottom: 135px;
            right: 45px;
            width: 65px;
            height: 65px;
            background: rgba(255, 215, 0, 0.85);
        }
        /* HUD 資訊欄 */
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            background: rgba(0, 0, 0, 0.25);
            padding: 10px 15px;
            border-radius: 10px;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="hud">
        <div>❤️ HP: <span id="hp-text">100/100</span></div>
        <div>⭐ 等級: <span id="level-text">1</span> (EXP: <span id="exp-text">0/10</span>)</div>
        <div>🔥 當前能力: <span id="ability-text">無 (Normal)</span></div>
        <div style="font-size:12px; margin-top:5px; color:#f0f0f0; font-weight:normal;">💻 鍵盤：WASD 移動 / 空白鍵 吸吐 / Shift 技能</div>
    </div>

    <!-- 手機觸控層 -->
    <div id="mobile-ui" class="mobile-ui">
        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>
        <div id="btn-inhale" class="touch-btn">吸/吐</div>
        <div id="btn-ability" class="touch-btn">技能</div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('game-container');

// 偵測是否為行動裝置或支援觸控，來決定是否顯示手機 UI
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
    document.getElementById('mobile-ui').style.display = 'block';
}

// 主角：卡比
const kirby = {
    x: 0,
    y: 0,
    radius: 22,
    speed: 4,
    hp: 100,
    maxHp: 100,
    level: 1,
    exp: 0,
    nextExp: 10,
    vx: 0,
    vy: 0,
    facingAngle: 0,
    
    isInhaling: false,
    mouthFull: null,
    ability: 'none',

    initPosition() {
        this.x = canvas.width / 2;
        this.y = canvas.height / 2;
    },

    update() {
        this.x += this.vx;
        this.y += this.vy;

        // 邊界邊界限制
        this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));

        if (this.vx !== 0 || this.vy !== 0) {
            this.facingAngle = Math.atan2(this.vy, this.vx);
        }
    },

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        // 卡比身體
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.mouthFull ? '#ff8da1' : '#ffb6c1';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#d65b7a';
        ctx.stroke();

        // 眼睛
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(6, -5, 3.5, 0, Math.PI * 2);
        ctx.arc(-6, -5, 3.5, 0, Math.PI * 2);
        ctx.fill();

        // 腮紅
        ctx.fillStyle = '#ff69b4';
        ctx.beginPath();
        ctx.arc(10, 2, 4, 0, Math.PI * 2);
        ctx.arc(-10, 2, 4, 0, Math.PI * 2);
        ctx.fill();

        // 嘴巴
        ctx.fillStyle = '#b3003b';
        ctx.beginPath();
        if (this.mouthFull) {
            ctx.arc(0, 4, 9, 0, Math.PI * 2);
        } else if (this.isInhaling) {
            ctx.arc(0, 4, 11, 0, Math.PI * 2);
        } else {
            ctx.arc(0, 2, 4, 0, Math.PI);
        }
        ctx.fill();

        // 吸氣氣流特效
        if (this.isInhaling && !this.mouthFull) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.lineWidth = 2.5;
            for (let i = -1; i <= 1; i++) {
                let angle = this.facingAngle + i * 0.35;
                ctx.beginPath();
                ctx.moveTo(Math.cos(angle) * 20, Math.sin(angle) * 20);
                ctx.lineTo(Math.cos(angle) * 90, Math.sin(angle) * 90);
                ctx.stroke();
            }
        }

        ctx.restore();
    }
};

// Canvas 尺寸自動調整
function resizeCanvas() {
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
    if (kirby.x === 0 && kirby.y === 0) {
        kirby.initPosition();
    }
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// 敵人與彈藥陣列
let enemies = [];
let bullets = [];
let particles = [];

class Enemy {
    constructor(x, y, type = 'waddle_dee') {
        this.x = x;
        this.y = y;
        this.type = type;
        this.radius = type === 'hot_head' ? 18 : 15;
        this.color = type === 'hot_head' ? '#ff4500' : '#ffa500';
        this.speed = type === 'hot_head' ? 1.2 : 1.6;
        this.hp = type === 'hot_head' ? 30 : 15;
    }

    update() {
        let angle = Math.atan2(kirby.y - this.y, kirby.x - this.x);
        this.x += Math.cos(angle) * this.speed;
        this.y += Math.sin(angle) * this.speed;

        // 被吸入邏輯
        if (kirby.isInhaling && !kirby.mouthFull) {
            let dist = Math.hypot(kirby.x - this.x, kirby.y - this.y);
            if (dist < 120) {
                this.x += (kirby.x - this.x) * 0.12;
                this.y += (kirby.y - this.y) * 0.12;
                
                if (dist < kirby.radius + 10) {
                    kirby.mouthFull = this;
                    enemies = enemies.filter(e => e !== this);
                    if (this.type === 'hot_head') kirby.ability = 'fire';
                    updateHUD();
                }
            }
        }
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#333';
        ctx.stroke();

        // 敵人眼睛
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(this.x - 4, this.y - 3, 3, 0, Math.PI * 2);
        ctx.arc(this.x + 4, this.y - 3, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(this.x - 4, this.y - 3, 1.5, 0, Math.PI * 2);
        ctx.arc(this.x + 4, this.y - 3, 1.5, 0, Math.PI * 2);
        ctx.fill();
    }
}

class StarBullet {
    constructor(x, y, angle) {
        this.x = x;
        this.y = y;
        this.vx = Math.cos(angle) * 11;
        this.vy = Math.sin(angle) * 11;
        this.radius = 12;
        this.alive = true;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
            this.alive = false;
        }

        enemies.forEach(e => {
            let dist = Math.hypot(e.x - this.x, e.y - this.y);
            if (dist < e.radius + this.radius) {
                e.hp -= 50;
                this.alive = false;
                addExplosion(this.x, this.y);
            }
        });
    }

    draw() {
        ctx.fillStyle = '#ffff00';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffa500';
        ctx.lineWidth = 2;
        ctx.stroke();
    }
}

function spawnEnemy() {
    if (enemies.length >= 25) return;
    let x, y;
    if (Math.random() < 0.5) {
        x = Math.random() < 0.5 ? -30 : canvas.width + 30;
        y = Math.random() * canvas.height;
    } else {
        x = Math.random() * canvas.width;
        y = Math.random() < 0.5 ? -30 : canvas.height + 30;
    }
    let type = Math.random() < 0.35 ? 'hot_head' : 'waddle_dee';
    enemies.push(new Enemy(x, y, type));
}

function addExplosion(x, y) {
    for (let i = 0; i < 10; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            life: 18,
            color: '#ffffaa'
        });
    }
}

function updateHUD() {
    document.getElementById('hp-text').innerText = `${kirby.hp}/${kirby.maxHp}`;
    document.getElementById('level-text').innerText = kirby.level;
    document.getElementById('exp-text').innerText = `${kirby.exp}/${kirby.nextExp}`;
    document.getElementById('ability-text').innerText = 
        kirby.ability === 'fire' ? '🔥 火焰 (Fire)' : '無 (Normal)';
}

// 鍵盤操控
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (e.code === 'Space') handleInhaleOrSpit();
    if (e.key === 'Shift') handleAbility();
});
window.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
    if (e.code === 'Space') kirby.isInhaling = false;
});

function handleInhaleOrSpit() {
    if (kirby.mouthFull) {
        bullets.push(new StarBullet(kirby.x, kirby.y, kirby.facingAngle));
        kirby.mouthFull = null;
    } else {
        kirby.isInhaling = true;
    }
}

function handleAbility() {
    if (kirby.ability === 'fire') {
        for (let i = 0; i < 12; i++) {
            let angle = (Math.PI * 2 / 12) * i;
            bullets.push(new StarBullet(kirby.x, kirby.y, angle));
        }
    }
}

// 手機搖桿控制
const base = document.getElementById('joystick-base');
const stick = document.getElementById('joystick-stick');
let joystickActive = false;
let touchStartX = 0, touchStartY = 0;

base.addEventListener('touchstart', e => {
    joystickActive = true;
    const touch = e.touches[0];
    const rect = base.getBoundingClientRect();
    touchStartX = rect.left + rect.width / 2;
    touchStartY = rect.top + rect.height / 2;
}, {passive: false});

window.addEventListener('touchmove', e => {
    if (!joystickActive) return;
    const touch = e.touches[0];
    let dx = touch.clientX - touchStartX;
    let dy = touch.clientY - touchStartY;
    let dist = Math.hypot(dx, dy);
    let maxRadius = 40;

    if (dist > maxRadius) {
        dx = (dx / dist) * maxRadius;
        dy = (dy / dist) * maxRadius;
    }

    stick.style.transform = `translate(${dx}px, ${dy}px)`;
    kirby.vx = (dx / maxRadius) * kirby.speed;
    kirby.vy = (dy / maxRadius) * kirby.speed;
}, {passive: false});

window.addEventListener('touchend', () => {
    joystickActive = false;
    stick.style.transform = `translate(0px, 0px)`;
    kirby.vx = 0;
    kirby.vy = 0;
});

document.getElementById('btn-inhale').addEventListener('touchstart', (e) => {
    e.preventDefault();
    handleInhaleOrSpit();
});
document.getElementById('btn-inhale').addEventListener('touchend', (e) => {
    e.preventDefault();
    kirby.isInhaling = false;
});
document.getElementById('btn-ability').addEventListener('touchstart', (e) => {
    e.preventDefault();
    handleAbility();
});

// 產生敵人的計時器
setInterval(spawnEnemy, 1200);

// 遊戲主循環
function gameLoop() {
    if (!joystickActive) {
        kirby.vx = 0;
        kirby.vy = 0;
        if (keys['a'] || keys['arrowleft']) kirby.vx = -kirby.speed;
        if (keys['d'] || keys['arrowright']) kirby.vx = kirby.speed;
        if (keys['w'] || keys['arrowup']) kirby.vy = -kirby.speed;
        if (keys['s'] || keys['arrowdown']) kirby.vy = kirby.speed;
    }

    kirby.update();

    enemies.forEach((e, idx) => {
        e.update();
        if (e.hp <= 0) {
            enemies.splice(idx, 1);
            kirby.exp += 5;
            if (kirby.exp >= kirby.nextExp) {
                kirby.level++;
                kirby.exp -= kirby.nextExp;
                kirby.nextExp = Math.floor(kirby.nextExp * 1.5);
            }
            updateHUD();
        }
    });

    bullets.forEach((b, idx) => {
        b.update();
        if (!b.alive) bullets.splice(idx, 1);
    });

    // 清空畫面
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 背景草地
    ctx.fillStyle = '#70c5ce';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 繪製角色
    kirby.draw();
    enemies.forEach(e => e.draw());
    bullets.forEach(b => b.draw());

    // 粒子效果
    particles.forEach((p, idx) => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(idx, 1);
    });

    requestAnimationFrame(gameLoop);
}

// 啟動遊戲
gameLoop();
</script>
</body>
</html>
