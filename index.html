<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kirby Bonk! - 星之卡比大亂鬥</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1024px;
            max-height: 768px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background-color: #70c5ce;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated; /* 保留像素風格粒度 */
        }
        /* 手機 UI 按鈕層 (預設隱藏，僅觸控裝置顯示) */
        .mobile-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none; 
        }
        .touch-btn {
            position: absolute;
            pointer-events: auto;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            border: 3px solid rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #333;
            font-size: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .touch-btn:active {
            background: rgba(255, 255, 255, 0.8);
            transform: scale(0.92);
        }
        #joystick-base {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.6);
            pointer-events: auto;
        }
        #joystick-stick {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 105, 180, 0.85);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        #btn-inhale {
            bottom: 40px;
            right: 40px;
            width: 75px;
            height: 75px;
            background: rgba(255, 182, 193, 0.85);
        }
        #btn-ability {
            bottom: 135px;
            right: 45px;
            width: 65px;
            height: 65px;
            background: rgba(255, 215, 0, 0.85);
        }
        /* HUD 資訊欄 */
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            background: rgba(0, 0, 0, 0.25);
            padding: 10px 15px;
            border-radius: 10px;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="hud">
        <div>❤️ HP: <span id="hp-text">100/100</span></div>
        <div>⭐ 等級: <span id="level-text">1</span> (EXP: <span id="exp-text">0/10</span>)</div>
        <div>🔥 當前能力: <span id="ability-text">無 (Normal)</span></div>
        <div style="font-size:12px; margin-top:5px; color:#f0f0f0; font-weight:normal;">💻 鍵盤：WASD 移動 / 空白鍵 吸吐 / Shift 技能</div>
    </div>

    <!-- 手機觸控層 -->
    <div id="mobile-ui" class="mobile-ui">
        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>
        <div id="btn-inhale" class="touch-btn">吸/吐</div>
        <div id="btn-ability" class="touch-btn">技能</div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('game-container');

// 判斷觸控裝置
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
    document.getElementById('mobile-ui').style.display = 'block';
}

// 🌐 載入外部卡比像素圖片
const kirbyImg = new Image();
kirbyImg.crossOrigin = "anonymous";
// 採用官方透明背景的像素圖源
kirbyImg.src = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/39.gif"; 

// 主角：卡比
const kirby = {
    x: 0,
    y: 0,
    radius: 24,
    speed: 4,
    hp: 100,
    maxHp: 100,
    level: 1,
    exp: 0,
    nextExp: 10,
    vx: 0,
    vy: 0,
    facingAngle: 0,
    
    isInhaling: false,
    mouthFull: null,
    ability: 'none',

    initPosition() {
        this.x = canvas.width / 2;
        this.y = canvas.height / 2;
    },

    update() {
        this.x += this.vx;
        this.y += this.vy;

        // 螢幕邊界限制
        this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));

        if (this.vx !== 0 || this.vy !== 0) {
            this.facingAngle = Math.atan2(this.vy, this.vx);
        }
    },

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        // 如果外部圖片載入成功，直接畫出圖片
        if (kirbyImg.complete && kirbyImg.naturalWidth !== 0) {
            // 根據面向方向調整翻轉
            if (this.vx < 0) {
                ctx.scale(-1, 1);
            }
            ctx.drawImage(kirbyImg, -this.radius * 1.3, -this.radius * 1.3, this.radius * 2.6, this.radius * 2.6);
        } else {
            // 圖片還沒載入完時的備用繪製 (粉紅圖形)
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.mouthFull ? '#ff8da1' : '#ffb
