<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kirby Bonk! - GIF 動畫流暢版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121223;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1024px;
            max-height: 768px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            background-color: #5bb381;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
        }
        
        .mobile-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
        }
        #joystick-container {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 130px;
            height: 130px;
            pointer-events: auto;
            background: #ffa1c5;
            border: 4px solid #331521;
            border-radius: 20px;
            box-shadow: inset -4px -4px 0px #d65b8c, inset 4px 4px 0px #ffcce0, 0 6px 0px #220d16;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #joystick-stick {
            position: absolute;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #ff4081;
            border: 3px solid #331521;
            box-shadow: inset -3px -3px 0px #990033, inset 3px 3px 0px #ff80ab;
        }
        .pixel-btn {
            position: absolute;
            pointer-events: auto;
            border-radius: 16px;
            border: 4px solid #331521;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #331521;
            font-size: 16px;
            text-shadow: 1px 1px 0px #fff;
            cursor: pointer;
        }
        .pixel-btn:active { transform: translateY(4px); box-shadow: none !important; }
        #btn-ability {
            bottom: 135px; right: 35px; width: 90px; height: 80px;
            background: #ffe066;
            box-shadow: inset -4px -4px 0px #ccab00, inset 4px 4px 0px #fff0aa, 0 6px 0px #220d16;
        }
        #btn-inhale {
            bottom: 35px; right: 35px; width: 90px; height: 80px;
            background: #ff9ebb;
            box-shadow: inset -4px -4px 0px #d65b8c, inset 4px 4px 0px #ffd1e0, 0 6px 0px #220d16;
        }
        #hud {
            position: absolute;
            top: 15px; left: 15px;
            color: white; font-size: 18px; font-weight: bold;
            text-shadow: 2px 2px 0px #000;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 18px; border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
        <div>❤️ HP: <span id="hp-text">100/100</span></div>
        <div>⭐ 等級: <span id="level-text">1</span> (EXP: <span id="exp-text">0/10</span>)</div>
        <div>🔥 狀態: <span id="ability-text">GIF 動畫流暢模式</span></div>
        <div style="font-size:12px; margin-top:5px; color:#ffe066;">💻 鍵盤：WASD 移動</div>
    </div>
    <div id="mobile-ui" class="mobile-ui">
        <div id="joystick-container"><div id="joystick-stick"></div></div>
        <div id="btn-ability" class="pixel-btn"><span style="font-size: 20px;">⚔️</span><span>技能</span></div>
        <div id="btn-inhale" class="pixel-btn"><span style="font-size: 20px;">🌀</span><span>吸/吐</span></div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('game-container');

if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
    document.getElementById('mobile-ui').style.display = 'block';
}

// 📥 直接載入 GIF 動畫圖檔
const kirbyGif = new Image();
kirbyGif.src = 'assets/kirby_walk.gif'; // 請將你的 GIF 命名為 kirby_walk.gif 並放入 assets/ 資料夾

const kirby = {
    x: 0, y: 0,
    speed: 4,
    vx: 0, vy: 0,
    facingRight: true,
    displaySize: 60, // 卡比顯示大小

    initPosition() {
        this.x = canvas.width / 2;
        this.y = canvas.height / 2;
    },

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.x = Math.max(30, Math.min(canvas.width - 30, this.x));
        this.y = Math.max(30, Math.min(canvas.height - 30, this.y));

        if (this.vx > 0) this.facingRight = true;
        if (this.vx < 0) this.facingRight = false;
    },

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        if (!this.facingRight) {
            ctx.scale(-1, 1); // 轉向時自動水平翻轉
        }

        if (kirbyGif.complete && kirbyGif.naturalWidth !== 0) {
            // 直接畫出 GIF，瀏覽器會自動撥放動態影格！
            ctx.drawImage(
                kirbyGif,
                -this.displaySize / 2, -this.displaySize / 2,
                this.displaySize, this.displaySize
            );
        } else {
            // 備用圓形
            ctx.beginPath();
            ctx.arc(0, 0, 24, 0, Math.PI * 2);
            ctx.fillStyle = '#ffb6c1';
            ctx.fill();
        }

        ctx.restore();
    }
};

function resizeCanvas() {
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
    if (kirby.x === 0 && kirby.y === 0) kirby.initPosition();
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const keys = {};
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

const base = document.getElementById('joystick-container');
const stick = document.getElementById('joystick-stick');
let joystickActive = false, touchStartX = 0, touchStartY = 0;

base.addEventListener('touchstart', e => {
    joystickActive = true;
    const rect = base.getBoundingClientRect();
    touchStartX = rect.left + rect.width / 2;
    touchStartY = rect.top + rect.height / 2;
}, {passive: false});

window.addEventListener('touchmove', e => {
    if (!joystickActive) return;
    const touch = e.touches[0];
    let dx = touch.clientX - touchStartX, dy = touch.clientY - touchStartY;
    let dist = Math.hypot(dx, dy), maxR = 35;
    if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
    stick.style.transform = `translate(${dx}px, ${dy}px)`;
    kirby.vx = (dx / maxR) * kirby.speed;
    kirby.vy = (dy / maxR) * kirby.speed;
}, {passive: false});

window.addEventListener('touchend', () => {
    joystickActive = false;
    stick.style.transform = `translate(0px, 0px)`;
    kirby.vx = 0; kirby.vy = 0;
});

function gameLoop() {
    if (!joystickActive) {
        kirby.vx = 0; kirby.vy = 0;
        if (keys['a'] || keys['arrowleft']) kirby.vx = -kirby.speed;
        if (keys['d'] || keys['arrowright']) kirby.vx = kirby.speed;
        if (keys['w'] || keys['arrowup']) kirby.vy = -kirby.speed;
        if (keys['s'] || keys['arrowdown']) kirby.vy = kirby.speed;
    }

    kirby.update();

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 草地背景
    ctx.fillStyle = '#5bb381';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#53a675';
    for (let x = 0; x < canvas.width; x += 40) {
        for (let y = 0; y < canvas.height; y += 40) {
            if ((x + y) % 80 === 0) ctx.fillRect(x, y, 40, 40);
        }
    }

    kirby.draw();

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
