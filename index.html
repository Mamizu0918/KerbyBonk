<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kirby Bonk! - 星之卡比大亂鬥</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121223;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1024px;
            max-height: 768px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            background-color: #5bb381;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
        }
        
        /* 📱 概念圖風格 UI 按鈕層 */
        .mobile-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
        }

        /* 粉紅像素搖桿 */
        #joystick-container {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 130px;
            height: 130px;
            pointer-events: auto;
            background: #ffa1c5;
            border: 4px solid #331521;
            border-radius: 20px;
            box-shadow: inset -4px -4px 0px #d65b8c, inset 4px 4px 0px #ffcce0, 0 6px 0px #220d16;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #joystick-stick {
            position: absolute;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #ff4081;
            border: 3px solid #331521;
            box-shadow: inset -3px -3px 0px #990033, inset 3px 3px 0px #ff80ab;
        }

        /* 概念圖風格技能按鈕 */
        .pixel-btn {
            position: absolute;
            pointer-events: auto;
            border-radius: 16px;
            border: 4px solid #331521;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #331521;
            font-size: 16px;
            text-shadow: 1px 1px 0px #fff;
            cursor: pointer;
        }
        .pixel-btn:active {
            transform: translateY(4px);
            box-shadow: none !important;
        }

        #btn-ability {
            bottom: 135px;
            right: 35px;
            width: 90px;
            height: 80px;
            background: #ffe066;
            box-shadow: inset -4px -4px 0px #ccab00, inset 4px 4px 0px #fff0aa, 0 6px 0px #220d16;
        }
        #btn-inhale {
            bottom: 35px;
            right: 35px;
            width: 90px;
            height: 80px;
            background: #ff9ebb;
            box-shadow: inset -4px -4px 0px #d65b8c, inset 4px 4px 0px #ffd1e0, 0 6px 0px #220d16;
        }

        /* HUD 資訊欄 */
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 18px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="hud">
        <div>❤️ HP: <span id="hp-text">100/100</span></div>
        <div>⭐ 等級: <span id="level-text">1</span> (EXP: <span id="exp-text">0/10</span>)</div>
        <div>🔥 當前能力: <span id="ability-text">無 (Normal)</span></div>
        <div style="font-size:12px; margin-top:5px; color:#ffe066; font-weight:normal;">💻 鍵盤：WASD 移動 / 空白鍵 吸吐 / Shift 技能</div>
    </div>

    <!-- 手機觸控 UI -->
    <div id="mobile-ui" class="mobile-ui">
        <div id="joystick-container">
            <div id="joystick-stick"></div>
        </div>
        <div id="btn-ability" class="pixel-btn">
            <span style="font-size: 20px;">⚔️</span>
            <span>技能</span>
        </div>
        <div id="btn-inhale" class="pixel-btn">
            <span style="font-size: 20px;">🌀</span>
            <span>吸/吐</span>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('game-container');

if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
    document.getElementById('mobile-ui').style.display = 'block';
}

// 🎨 像素風格卡比與瓦豆魯迪 SVG 精靈圖
const kirbySVG = `data:image/svg+xml;utf8,
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <!-- 腳部 -->
    <rect x="4" y="24" width="8" height="6" fill="%23d60036"/>
    <rect x="20" y="24" width="8" height="6" fill="%23d60036"/>
    <!-- 身體外框 -->
    <rect x="8" y="6" width="16" height="20" fill="%23ff9ebb"/>
    <rect x="6" y="8" width="20" height="16" fill="%23ff9ebb"/>
    <!-- 眼睛 -->
    <rect x="11" y="11" width="2" height="6" fill="%23000"/>
    <rect x="19" y="11" width="2" height="6" fill="%23000"/>
    <rect x="11" y="11" width="2" height="2" fill="%23fff"/>
    <rect x="19" y="11" width="2" height="2" fill="%23fff"/>
    <!-- 腮紅 -->
    <rect x="8" y="16" width="3" height="2" fill="%23ff3366"/>
    <rect x="21" y="16" width="3" height="2" fill="%23ff3366"/>
    <!-- 嘴巴 -->
    <rect x="15" y="17" width="2" height="2" fill="%23990026"/>
</svg>`;

const waddleDeeSVG = `data:image/svg+xml;utf8,
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <rect x="4" y="24" width="8" height="6" fill="%23e65c00"/>
    <rect x="20" y="24" width="8" height="6" fill="%23e65c00"/>
    <rect x="8" y="6" width="16" height="20" fill="%23ff9933"/>
    <rect x="6" y="8" width="20" height="16" fill="%23ff9933"/>
    <rect x="10" y="10" width="12" height="13" fill="%23ffebd7"/>
    <rect x="12" y="12" width="2" height="5" fill="%23000"/>
    <rect x="18" y="12" width="2" height="5" fill="%23000"/>
</svg>`;

const kirbyImg = new Image(); kirbyImg.src = kirbySVG;
const waddleDeeImg = new Image(); waddleDeeImg.src = waddleDeeSVG;

const kirby = {
    x: 0, y: 0, radius: 26, speed: 4, hp: 100, maxHp: 100, level: 1, exp: 0, nextExp: 10,
    vx: 0, vy: 0, facingAngle: 0, isInhaling: false, mouthFull: null, ability: 'none',
    
    initPosition() { this.x = canvas.width / 2; this.y = canvas.height / 2; },
    update() {
        this.x += this.vx; this.y += this.vy;
        this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));
        if (this.vx !== 0 || this.vy !== 0) this.facingAngle = Math.atan2(this.vy, this.vx);
    },
    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        if (this.vx < 0) ctx.scale(-1, 1);
        ctx.drawImage(kirbyImg, -this.radius, -this.radius, this.radius * 2, this.radius * 2);
        
        if (this.isInhaling && !this.mouthFull) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.lineWidth = 3;
            for (let i = -1; i <= 1; i++) {
                let angle = this.facingAngle + i * 0.35;
                ctx.beginPath();
                ctx.moveTo(Math.cos(angle) * 20, Math.sin(angle) * 20);
                ctx.lineTo(Math.cos(angle) * 80, Math.sin(angle) * 80);
                ctx.stroke();
            }
        }
        ctx.restore();
    }
};

function resizeCanvas() {
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
    if (kirby.x === 0 && kirby.y === 0) kirby.initPosition();
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let enemies = [];
let bullets = [];

class Enemy {
    constructor(x, y) {
        this.x = x; this.y = y; this.radius = 20; this.speed = 1.5; this.hp = 15;
    }
    update() {
        let angle = Math.atan2(kirby.y - this.y, kirby.x - this.x);
        this.x += Math.cos(angle) * this.speed;
        this.y += Math.sin(angle) * this.speed;

        if (kirby.isInhaling && !kirby.mouthFull) {
            let dist = Math.hypot(kirby.x - this.x, kirby.y - this.y);
            if (dist < 110) {
                this.x += (kirby.x - this.x) * 0.15;
                this.y += (kirby.y - this.y) * 0.15;
                if (dist < kirby.radius + 10) {
                    kirby.mouthFull = this;
                    enemies = enemies.filter(e => e !== this);
                    kirby.ability = 'fire';
                    updateHUD();
                }
            }
        }
    }
    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.drawImage(waddleDeeImg, -this.radius, -this.radius, this.radius * 2, this.radius * 2);
        ctx.restore();
    }
}

class StarBullet {
    constructor(x, y, angle) {
        this.x = x; this.y = y;
        this.vx = Math.cos(angle) * 10; this.vy = Math.sin(angle) * 10;
        this.radius = 12; this.alive = true;
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.alive = false;
        enemies.forEach(e => {
            if (Math.hypot(e.x - this.x, e.y - this.y) < e.radius + this.radius) {
                e.hp -= 50; this.alive = false;
            }
        });
    }
    draw() {
        ctx.fillStyle = '#ffea00';
        ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = '#ff6d00'; ctx.stroke();
    }
}

function spawnEnemy() {
    if (enemies.length >= 20) return;
    let x = Math.random() < 0.5 ? -30 : canvas.width + 30;
    let y = Math.random() * canvas.height;
    enemies.push(new Enemy(x, y));
}

function updateHUD() {
    document.getElementById('hp-text').innerText = `${kirby.hp}/${kirby.maxHp}`;
    document.getElementById('level-text').innerText = kirby.level;
    document.getElementById('exp-text').innerText = `${kirby.exp}/${kirby.nextExp}`;
    document.getElementById('ability-text').innerText = kirby.ability === 'fire' ? '🔥 火焰 (Fire)' : '無 (Normal)';
}

const keys = {};
window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (e.code === 'Space') handleInhaleOrSpit();
    if (e.key === 'Shift') handleAbility();
});
window.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
    if (e.code === 'Space') kirby.isInhaling = false;
});

function handleInhaleOrSpit() {
    if (kirby.mouthFull) {
        bullets.push(new StarBullet(kirby.x, kirby.y, kirby.facingAngle));
        kirby.mouthFull = null;
    } else {
        kirby.isInhaling = true;
    }
}

function handleAbility() {
    if (kirby.ability === 'fire') {
        for (let i = 0; i < 12; i++) {
            bullets.push(new StarBullet(kirby.x, kirby.y, (Math.PI * 2 / 12) * i));
        }
    }
}

// 搖桿手勢觸控
const base = document.getElementById('joystick-container');
const stick = document.getElementById('joystick-stick');
let joystickActive = false, touchStartX = 0, touchStartY = 0;

base.addEventListener('touchstart', e => {
    joystickActive = true;
    const rect = base.getBoundingClientRect();
    touchStartX = rect.left + rect.width / 2;
    touchStartY = rect.top + rect.height / 2;
}, {passive: false});

window.addEventListener('touchmove', e => {
    if (!joystickActive) return;
    const touch = e.touches[0];
    let dx = touch.clientX - touchStartX, dy = touch.clientY - touchStartY;
    let dist = Math.hypot(dx, dy), maxR = 35;
    if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
    stick.style.transform = `translate(${dx}px, ${dy}px)`;
    kirby.vx = (dx / maxR) * kirby.speed;
    kirby.vy = (dy / maxR) * kirby.speed;
}, {passive: false});

window.addEventListener('touchend', () => {
    joystickActive = false;
    stick.style.transform = `translate(0px, 0px)`;
    kirby.vx = 0; kirby.vy = 0;
});

document.getElementById('btn-inhale').addEventListener('touchstart', (e) => { e.preventDefault(); handleInhaleOrSpit(); });
document.getElementById('btn-inhale').addEventListener('touchend', (e) => { e.preventDefault(); kirby.isInhaling = false; });
document.getElementById('btn-ability').addEventListener('touchstart', (e) => { e.preventDefault(); handleAbility(); });

setInterval(spawnEnemy, 1300);

function gameLoop() {
    if (!joystickActive) {
        kirby.vx = 0; kirby.vy = 0;
        if (keys['a'] || keys['arrowleft']) kirby.vx = -kirby.speed;
        if (keys['d'] || keys['arrowright']) kirby.vx = kirby.speed;
        if (keys['w'] || keys['arrowup']) kirby.vy = -kirby.speed;
        if (keys['s'] || keys['arrowdown']) kirby.vy = kirby.speed;
    }

    kirby.update();
    enemies.forEach((e, idx) => {
        e.update();
        if (e.hp <= 0) {
            enemies.splice(idx, 1);
            kirby.exp += 5;
            if (kirby.exp >= kirby.nextExp) {
                kirby.level++; kirby.exp -= kirby.nextExp; kirby.nextExp = Math.floor(kirby.nextExp * 1.5);
            }
            updateHUD();
        }
    });

    bullets.forEach((b, idx) => {
        b.update();
        if (!b.alive) bullets.splice(idx, 1);
    });

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 🌿 繪製綠意盎然的網格草地背景
    ctx.fillStyle = '#5bb381';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#53a675';
    for (let x = 0; x < canvas.width; x += 40) {
        for (let y = 0; y < canvas.height; y += 40) {
            if ((x + y) % 80 === 0) ctx.fillRect(x, y, 40, 40);
        }
    }

    kirby.draw();
    enemies.forEach(e => e.draw());
    bullets.forEach(b => b.draw());

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
