<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kirby Bonk! - 星之卡比大亂鬥</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1024px;
            max-height: 768px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background-color: #70c5ce;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* 手機 UI 按鈕層 */
        .mobile-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none; 
        }
        .touch-btn {
            position: absolute;
            pointer-events: auto;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            border: 3px solid rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #333;
            font-size: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .touch-btn:active {
            background: rgba(255, 255, 255, 0.8);
            transform: scale(0.92);
        }
        #joystick-base {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.6);
            pointer-events: auto;
        }
        #joystick-stick {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 105, 180, 0.85);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        #btn-inhale {
            bottom: 40px;
            right: 40px;
            width: 75px;
            height: 75px;
            background: rgba(255, 182, 193, 0.85);
        }
        #btn-ability {
            bottom: 135px;
            right: 45px;
            width: 65px;
            height: 65px;
            background: rgba(255, 215, 0, 0.85);
        }
        /* HUD 資訊欄 */
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            background: rgba(0, 0, 0, 0.25);
            padding: 10px 15px;
            border-radius: 10px;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="hud">
        <div>❤️ HP: <span id="hp-text">100/100</span></div>
        <div>⭐ 等級: <span id="level-text">1</span> (EXP: <span id="exp-text">0/10</span>)</div>
        <div>🔥 當前能力: <span id="ability-text">無 (Normal)</span></div>
        <div style="font-size:12px; margin-top:5px; color:#f0f0f0; font-weight:normal;">💻 鍵盤：WASD 移動 / 空白鍵 吸吐 / Shift 技能</div>
    </div>

    <!-- 手機觸控層 -->
    <div id="mobile-ui" class="mobile-ui">
        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>
        <div id="btn-inhale" class="touch-btn">吸/吐</div>
        <div id="btn-ability" class="touch-btn">技能</div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('game-container');

if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
    document.getElementById('mobile-ui').style.display = 'block';
}

// 🎨 內嵌 SVG 矢量圖形，完全免除外部伺服器防盜鏈限制
const kirbySVG = `data:image/svg+xml;utf8,
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <ellipse cx="28" cy="80" rx="16" ry="10" fill="%23d62828" transform="rotate(-10 28 80)"/>
    <ellipse cx="72" cy="80" rx="16" ry="10" fill="%23d62828" transform="rotate(10 72 80)"/>
    <circle cx="50" cy="50" r="38" fill="%23ffb6c1" stroke="%23e65c00" stroke-width="2"/>
    <ellipse cx="20" cy="50" rx="8" ry="10" fill="%23ff9ebb" transform="rotate(-20 20 50)"/>
    <ellipse cx="80" cy="50" rx="8" ry="10" fill="%23ff9ebb" transform="rotate(20 80 50)"/>
    <ellipse cx="42" cy="42" rx="4.5" ry="9" fill="%23001219"/>
    <ellipse cx="58" cy="42" rx="4.5" ry="9" fill="%23001219"/>
    <circle cx="42" cy="38" r="2" fill="%23ffffff"/>
    <circle cx="58" cy="38" r="2" fill="%23ffffff"/>
    <ellipse cx="33" cy="52" rx="5" ry="3" fill="%23ff4d6d"/>
    <ellipse cx="67" cy="52" rx="5" ry="3" fill="%23ff4d6d"/>
    <path d="M 45 54 Q 50 62 55 54 Z" fill="%239d0208"/>
</svg>`;

const waddleDeeSVG = `data:image/svg+xml;utf8,
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <ellipse cx="28" cy="80" rx="15" ry="9" fill="%23f77f00" transform="rotate(-10 28 80)"/>
    <ellipse cx="72" cy="80" rx="15" ry="9" fill="%23f77f00" transform="rotate(10 72 80)"/>
    <circle cx="50" cy="50" r="36" fill="%23f4a261" stroke="%23e76f51" stroke-width="2"/>
    <ellipse cx="50" cy="52" rx="24" ry="22" fill="%23ffe8d6"/>
    <ellipse cx="43" cy="45" rx="3.5" ry="7" fill="%23000000"/>
    <ellipse cx="57" cy="45" rx="3.5" ry="7" fill="%23000000"/>
    <circle cx="43" cy="42" r="1.5" fill="%23ffffff"/>
    <circle cx="57" cy="42" r="1.5" fill="%23ffffff"/>
</svg>`;

const kirbyImg = new Image();
kirbyImg.src = kirbySVG;

const waddleDeeImg = new Image();
waddleDeeImg.src = waddleDeeSVG;

// 主角：卡比
const kirby = {
    x: 0,
    y: 0,
    radius: 25,
    speed: 4,
    hp: 100,
    maxHp: 100,
    level: 1,
    exp: 0,
    nextExp: 10,
    vx: 0,
    vy: 0,
    facingAngle: 0,
    
    isInhaling: false,
    mouthFull: null,
    ability: 'none',

    initPosition() {
        this.x = canvas.width / 2;
        this.y = canvas.height / 2;
    },

    update() {
        this.x += this.vx;
        this.y += this.vy;

        this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));

        if (this.vx !== 0 || this.vy !== 0) {
            this.facingAngle = Math.atan2(this.vy, this.vx);
        }
    },

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        if (this.vx < 0) {
            ctx.scale(-1, 1);
        }

        ctx.drawImage(kirbyImg, -this.radius * 1.3, -this.radius * 1.3, this.radius * 2.6, this.radius * 2.6);

        if (this.isInhaling && !this.mouthFull) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.lineWidth = 2.5;
            for (let i = -1; i <= 1; i++) {
                let angle = this.facingAngle + i * 0.35;
                ctx.beginPath();
                ctx.moveTo(Math.cos(angle) * 20, Math.sin(angle) * 20);
                ctx.lineTo(Math.cos(angle) * 90, Math.sin(angle) * 90);
                ctx.stroke();
            }
        }

        ctx.restore();
    }
};

function resizeCanvas() {
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
    if (kirby.x === 0 && kirby.y === 0) {
        kirby.initPosition();
    }
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let enemies = [];
let bullets = [];
let particles = [];

class Enemy {
    constructor(x, y, type = 'waddle_dee') {
        this.x = x;
        this.y = y;
        this.type = type;
        this.radius = type === 'hot_head' ? 20 : 18;
        this.speed = type === 'hot_head' ? 1.2 : 1.6;
        this.hp = type === 'hot_head' ? 30 : 15;
    }

    update() {
        let angle = Math.atan2(kirby.y - this.y, kirby.x - this.x);
        this.x += Math.cos(angle) * this.speed;
        this.y += Math.sin(angle) * this.speed;

        if (kirby.isInhaling && !kirby.mouthFull) {
            let dist = Math.hypot(kirby.x - this.x, kirby.y - this.y);
            if (dist < 120) {
                this.x += (kirby.x - this.x) * 0.12;
                this.y += (kirby.y - this.y) * 0.12;
                
                if (dist < kirby.radius + 10) {
                    kirby.mouthFull = this;
                    enemies = enemies.filter(e => e !== this);
                    if (this.type === 'hot_head') kirby.ability = 'fire';
                    updateHUD();
                }
            }
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.drawImage(waddleDeeImg, -this.radius * 1.2, -this.radius * 1.2, this.radius * 2.4, this.radius * 2.4);
        ctx.restore();
    }
}

class StarBullet {
    constructor(x, y, angle) {
        this.x = x;
        this.y = y;
        this.vx = Math.cos(angle) * 11;
        this.vy = Math.sin(angle) * 11;
        this.radius = 12;
        this.alive = true;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
            this.alive = false;
        }

        enemies.forEach(e => {
            let dist = Math.hypot(e.x - this.x, e.y - this.y);
            if (dist < e.radius + this.radius) {
                e.hp -= 50;
                this.alive = false;
                addExplosion(this.x, this.y);
            }
        });
    }

    draw() {
        ctx.fillStyle = '#ffff00';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffa500';
        ctx.lineWidth = 2;
        ctx.stroke();
    }
}

function spawnEnemy() {
    if (enemies.length >= 25) return;
    let x, y;
    if (Math.random() < 0.5) {
        x = Math.random() < 0.5 ? -30 : canvas.width + 30;
        y = Math.random() * canvas.height;
    } else {
        x = Math.random() * canvas.width;
        y = Math.random() < 0.5 ? -30 : canvas.height + 30;
    }
    enemies.push(new Enemy(x, y));
}

function addExplosion(x, y) {
    for (let i = 0; i < 10; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            life: 18,
            color: '#ffffaa'
        });
    }
}

function updateHUD() {
    document.getElementById('hp-text').innerText = `${kirby.hp}/${kirby.maxHp}`;
    document.getElementById('level-text').innerText = kirby.level;
    document.getElementById('exp-text').innerText = `${kirby.exp}/${kirby.nextExp}`;
    document.getElementById('ability-text').innerText = 
        kirby.ability === 'fire' ? '🔥 火焰 (Fire)' : '無 (Normal)';
}

const keys = {};
window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (e.code === 'Space') handleInhaleOrSpit();
    if (e.key === 'Shift') handleAbility();
});
window.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
    if (e.code === 'Space') kirby.isInhaling = false;
});

function handleInhaleOrSpit() {
    if (kirby.mouthFull) {
        bullets.push(new StarBullet(kirby.x, kirby.y, kirby.facingAngle));
        kirby.mouthFull = null;
    } else {
        kirby.isInhaling = true;
    }
}

function handleAbility() {
    if (kirby.ability === 'fire') {
        for (let i = 0; i < 12; i++) {
            let angle = (Math.PI * 2 / 12) * i;
            bullets.push(new StarBullet(kirby.x, kirby.y, angle));
        }
    }
}

const base = document.getElementById('joystick-base');
const stick = document.getElementById('joystick-stick');
let joystickActive = false;
let touchStartX = 0, touchStartY = 0;

base.addEventListener('touchstart', e => {
    joystickActive = true;
    const touch = e.touches[0];
    const rect = base.getBoundingClientRect();
    touchStartX = rect.left + rect.width / 2;
    touchStartY = rect.top + rect.height / 2;
}, {passive: false});

window.addEventListener('touchmove', e => {
    if (!joystickActive) return;
    const touch = e.touches[0];
    let dx = touch.clientX - touchStartX;
    let dy = touch.clientY - touchStartY;
    let dist = Math.hypot(dx, dy);
    let maxRadius = 40;

    if (dist > maxRadius) {
        dx = (dx / dist) * maxRadius;
        dy = (dy / dist) * maxRadius;
    }

    stick.style.transform = `translate(${dx}px, ${dy}px)`;
    kirby.vx = (dx / maxRadius) * kirby.speed;
    kirby.vy = (dy / maxRadius) * kirby.speed;
}, {passive: false});

window.addEventListener('touchend', () => {
    joystickActive = false;
    stick.style.transform = `translate(0px, 0px)`;
    kirby.vx = 0;
    kirby.vy = 0;
});

document.getElementById('btn-inhale').addEventListener('touchstart', (e) => {
    e.preventDefault();
    handleInhaleOrSpit();
});
document.getElementById('btn-inhale').addEventListener('touchend', (e) => {
    e.preventDefault();
    kirby.isInhaling = false;
});
document.getElementById('btn-ability').addEventListener('touchstart', (e) => {
    e.preventDefault();
    handleAbility();
});

setInterval(spawnEnemy, 1200);

function gameLoop() {
    if (!joystickActive) {
        kirby.vx = 0;
        kirby.vy = 0;
        if (keys['a'] || keys['arrowleft']) kirby.vx = -kirby.speed;
        if (keys['d'] || keys['arrowright']) kirby.vx = kirby.speed;
        if (keys['w'] || keys['arrowup']) kirby.vy = -kirby.speed;
        if (keys['s'] || keys['arrowdown']) kirby.vy = kirby.speed;
    }

    kirby.update();

    enemies.forEach((e, idx) => {
        e.update();
        if (e.hp <= 0) {
            enemies.splice(idx, 1);
            kirby.exp += 5;
            if (kirby.exp >= kirby.nextExp) {
                kirby.level++;
                kirby.exp -= kirby.nextExp;
                kirby.nextExp = Math.floor(kirby.nextExp * 1.5);
            }
            updateHUD();
        }
    });

    bullets.forEach((b, idx) => {
        b.update();
        if (!b.alive) bullets.splice(idx, 1);
    });

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#70c5ce';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    kirby.draw();
    enemies.forEach(e => e.draw());
    bullets.forEach(b => b.draw());

    particles.forEach((p, idx) => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(idx, 1);
    });

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
